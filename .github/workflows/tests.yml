name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt needs these shared libraries even under the offscreen
      # platform plugin; without them PySide6 imports but cannot
      # create a QApplication.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install the package and its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The job log needs a GitHub login to read; an annotation does not.
      # On failure the tail of pytest's output -- the failures, or the
      # traceback faulthandler prints for a crash -- becomes one.
      - name: Run the test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            body=$(tail -n 60 pytest.log | sed -e 's/%/%25/g' -e 's/\r//g' \
                   | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=pytest exited with $status::$body"
          fi
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Check for unused imports, undefined names and import order
        run: ruff check birds main.py tests
