name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}${{ matrix.pandas != 'latest' && format(' · pandas {0}', matrix.pandas) || '' }}
    runs-on: ${{ matrix.os }}
    # No macOS here.  GitHub's Mac runners never picked the job up: every
    # run it sat unassigned for a quarter of an hour ("not acquired by
    # Runner ... capacity constraints") and was cancelled, and a cancelled
    # job fails the run even with continue-on-error.  macOS is the
    # development system -- the suite runs there before every commit and
    # the Mac app is built there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        pandas: ["latest"]
        # Python 3.9 gets pandas 2 and 3.12 gets pandas 3 by themselves;
        # this one holds pandas 2 on the newer Python, so both pandas
        # are tested side by side.  pandas 3 changed how missing text is
        # stored, which once emptied every Classification diagram.  (A
        # different value of an existing key makes it a job of its own
        # rather than merging into ubuntu / 3.12.)
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            pandas: "<3"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt needs these shared libraries even under the offscreen
      # platform plugin; without them PySide6 imports but cannot
      # create a QApplication.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        # A package mirror once held this step for over an hour: each
        # attempt gets five minutes, and there are three.
        timeout-minutes: 20
        run: |
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if $apt update && $apt install -y \
                 libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
                 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0; then
              exit 0
            fi
            echo "::warning::Installing the Qt libraries failed (attempt $attempt)"
            sleep 15
          done
          exit 1

      - name: Install the package and its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Hold pandas back
        if: matrix.pandas != 'latest'
        shell: bash
        run: python -m pip install "pandas${{ matrix.pandas }}"

      - name: Report the versions tested
        shell: bash
        run: python -c "import sys, pandas, numpy, matplotlib, PySide6; print(sys.version.split()[0], 'pandas', pandas.__version__, 'numpy', numpy.__version__, 'matplotlib', matplotlib.__version__, 'PySide6', PySide6.__version__)"

      # The job log needs a GitHub login to read; an annotation does not.
      # On failure the tail of pytest's output -- the failures, or the
      # traceback faulthandler prints for a crash -- becomes one.
      - name: Run the test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            body=$(tail -n 60 pytest.log | sed -e 's/%/%25/g' -e 's/\r//g' \
                   | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=pytest exited with $status::$body"
          fi
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Check for unused imports, undefined names and import order
        run: ruff check birds main.py tests
