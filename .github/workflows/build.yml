name: build

# The Windows installer and the Linux bundle, built on their own systems
# -- PyInstaller packages for the platform it runs on.  Run by hand from
# the Actions tab, or by pushing a version tag; the results are the
# run's artifacts, and a version tag also files them as a draft release.
# The macOS app is built on a Mac with packaging/update_mac_app.py.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install B.I.R.D.S, the map extras and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[map]" pyinstaller

      - name: Build the application
        run: pyinstaller packaging\birds.spec --noconfirm

      # Puts a diagram, the kriging, UTM and MGRS, the CIPW norm, a
      # session and an Excel file through the packaged code.
      - name: Self-test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\BIRDS\BIRDS.exe `
               -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: iscc packaging\windows\birds.iss

      - uses: actions/upload-artifact@v7
        with:
          name: BIRDS-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  linux:
    # A bundle runs only where the C library is at least as new as the
    # one it was built against, so it is built on a settled release
    # rather than on whatever ubuntu-latest has just moved to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install B.I.R.D.S, the map extras and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[map]" pyinstaller

      - name: Build the application
        run: pyinstaller packaging/birds.spec --noconfirm

      - name: Self-test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/BIRDS/BIRDS --self-test

      # The program with what registers .birds sessions on the desktop:
      # see "Linux" in packaging/README.md.
      - name: Pack the bundle
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'packaging'); import app_info; print(app_info.version())")
          mkdir -p dist/pack/BIRDS-linux
          cp -r dist/BIRDS dist/pack/BIRDS-linux/
          cp packaging/linux/* dist/pack/BIRDS-linux/
          cp packaging/icons/birds_app_256.png \
             packaging/icons/birds_document_256.png dist/pack/BIRDS-linux/
          tar -C dist/pack -czf "dist/BIRDS-${version}-linux-x86_64.tar.gz" BIRDS-linux

      - uses: actions/upload-artifact@v7
        with:
          name: BIRDS-linux
          path: dist/BIRDS-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # Users find programs under Releases, not among a run's artifacts,
  # which need a GitHub login and expire.  A version tag files both
  # builds there as a draft: nothing is public until it is published by
  # hand from the Releases page, where the macOS app is added too.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The files are named after birds/__init__.py; a tag saying
      # otherwise would file them under the wrong version.
      - name: Check the tag against the version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'packaging'); import app_info; print(app_info.version())")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but birds/__init__.py says $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A beta or release candidate (v0.1.0b1, v0.2.0rc1) is marked as
      # a pre-release, which GitHub does not offer as the latest version.
      - name: File the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            pre="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre \
            --verify-tag --title "B.I.R.D.S $GITHUB_REF_NAME" --generate-notes
